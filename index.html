<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070817">

<title>Khayal AI - خيال AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(104,45,255,.22),transparent 35%),
    linear-gradient(180deg,#08091b,#050615 70%,#070817);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(120,90,255,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,90,255,.18) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  height:110px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  background:rgba(7,8,23,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(130,90,255,.28);
}

.logo{
  display:flex;
  align-items:center;
  gap:18px;
  direction:ltr;
}

.logo-icon{
  width:76px;
  height:76px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:linear-gradient(135deg,#5730ff,#9c2cff);
  box-shadow:0 0 35px rgba(109,51,255,.45);
}

.logo-text{
  font-size:42px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo-text span{
  background:linear-gradient(90deg,#fff,#b77cff);
  -webkit-background-clip:text;
  color:transparent;
}

.login{
  border:0;
  color:white;
  font-size:22px;
  font-weight:bold;
  padding:20px 32px;
  border-radius:24px;
  background:linear-gradient(135deg,#5630ff,#a62bff);
  box-shadow:0 10px 35px rgba(106,42,255,.35);
}

/* MAIN */

.container{
  width:min(1100px,92%);
  margin:auto;
}

.hero{
  text-align:center;
  padding:100px 0 65px;
}

.hero h1{
  font-size:clamp(44px,8vw,78px);
  line-height:1.25;
  font-weight:900;
  margin-bottom:25px;
}

.hero h1 span{
  background:linear-gradient(90deg,#fff,#9e68ff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#9ea4ca;
  font-size:22px;
  line-height:1.9;
  max-width:760px;
  margin:auto;
}

/* MODES */

.modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:70px;
}

.mode{
  min-height:245px;
  border:2px solid rgba(110,105,190,.4);
  border-radius:34px;
  background:rgba(10,12,35,.68);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.3s ease;
}

.mode:hover{
  transform:translateY(-5px);
  border-color:#7044ff;
  box-shadow:0 15px 45px rgba(94,46,255,.2);
}

.mode.active{
  border-color:#8745ff;
  background:linear-gradient(145deg,#5730ff,#9d2cff);
  box-shadow:0 18px 55px rgba(102,43,255,.3);
}

.mode-icon{
  font-size:48px;
  margin-bottom:25px;
}

.mode-title{
  font-size:27px;
  font-weight:bold;
}

/* WORKSPACE */

.workspace{
  border:2px solid rgba(103,98,180,.38);
  border-radius:38px;
  padding:45px;
  background:rgba(6,8,25,.72);
  box-shadow:0 20px 80px rgba(0,0,0,.22);
  margin-bottom:70px;
}

.workspace h2{
  text-align:center;
  font-size:42px;
  margin-bottom:14px;
}

.workspace-sub{
  text-align:center;
  color:#9298be;
  font-size:19px;
  line-height:1.8;
  margin-bottom:30px;
}

/* TOGGLE */

.toggle{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:25px;
}

.toggle button{
  border:1px solid #393b69;
  background:#0d102b;
  color:#b7bbda;
  padding:12px 25px;
  border-radius:15px;
  font-size:17px;
}

.toggle button.active{
  color:#fff;
  background:linear-gradient(135deg,#5630ff,#912eff);
  border-color:transparent;
}

/* TEXTAREA */

.prompt-wrap{
  position:relative;
}

textarea{
  width:100%;
  min-height:280px;
  resize:vertical;
  border-radius:30px;
  border:2px solid #30345d;
  outline:none;
  background:#080a20;
  color:white;
  padding:30px;
  font-size:23px;
  line-height:1.8;
  direction:auto;
}

textarea:focus{
  border-color:#7547ff;
  box-shadow:0 0 30px rgba(112,65,255,.12);
}

.counter{
  text-align:left;
  color:#747a9f;
  font-size:18px;
  margin-top:12px;
}

/* BUTTON */

.generate{
  width:100%;
  border:0;
  border-radius:27px;
  margin-top:32px;
  padding:25px;
  color:white;
  font-size:27px;
  font-weight:bold;
  background:linear-gradient(135deg,#5830ff,#a52cff);
  box-shadow:0 15px 40px rgba(99,42,255,.28);
  cursor:pointer;
  transition:.25s;
}

.generate:hover{
  transform:translateY(-2px);
}

.generate:disabled{
  opacity:.65;
  cursor:wait;
}

/* RESULT */

.result{
  display:none;
  margin-top:45px;
  border:2px solid #292d52;
  border-radius:32px;
  padding:20px;
  background:#07091d;
}

.result.show{
  display:block;
}

.result-image-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:24px;
}

.result img{
  width:100%;
  display:block;
  border-radius:24px;
}

/* WATERMARK PREVIEW */

.watermark-preview{
  position:absolute;
  right:18px;
  bottom:18px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border-radius:12px;
  background:rgba(5,7,20,.58);
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);
  color:rgba(255,255,255,.78);
  font-size:13px;
  font-weight:bold;
  direction:ltr;
  pointer-events:none;
}

.watermark-star{
  font-size:14px;
  color:#b98cff;
}

/* ACTIONS */

.result-actions{
  display:flex;
  gap:14px;
  margin-top:18px;
}

.result-actions a,
.result-actions button{
  flex:1;
  text-align:center;
  border:0;
  border-radius:17px;
  padding:17px;
  color:white;
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(135deg,#5630ff,#982eff);
  cursor:pointer;
}

.result-actions .secondary{
  background:#171a38;
  border:1px solid #343862;
}

/* LOADING */

.loading{
  text-align:center;
  padding:55px 20px;
  color:#aaaed0;
  font-size:20px;
}

.spinner{
  width:42px;
  height:42px;
  margin:auto;
  border:4px solid #292d50;
  border-top-color:#9142ff;
  border-radius:50%;
  display:block;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  z-index:500;
  background:#15182f;
  border:1px solid #464a78;
  color:white;
  padding:15px 24px;
  border-radius:15px;
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* FOOTER */

footer{
  text-align:center;
  color:#70769d;
  padding:30px 20px 50px;
  font-size:15px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    height:105px;
    padding:14px 18px;
  }

  .logo{
    gap:10px;
  }

  .logo-icon{
    width:68px;
    height:68px;
    border-radius:22px;
    font-size:34px;
  }

  .logo-text{
    font-size:31px;
  }

  .login{
    font-size:17px;
    padding:17px 20px;
    border-radius:22px;
  }

  .hero{
    padding:75px 10px 50px;
  }

  .hero h1{
    font-size:47px;
  }

  .hero p{
    font-size:19px;
  }

  .modes{
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:45px;
  }

  .mode{
    min-height:190px;
    border-radius:25px;
  }

  .mode-icon{
    font-size:38px;
    margin-bottom:17px;
  }

  .mode-title{
    font-size:20px;
  }

  .workspace{
    padding:22px 14px;
    border-radius:30px;
  }

  .workspace h2{
    font-size:34px;
  }

  textarea{
    min-height:260px;
    font-size:21px;
    padding:22px;
    border-radius:25px;
  }

  .generate{
    font-size:23px;
    padding:22px;
  }

  .result-actions{
    flex-direction:column;
  }

  .watermark-preview{
    right:12px;
    bottom:12px;
    font-size:11px;
    padding:6px 9px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div class="logo-text">Khayal <span>AI</span></div>
  </div>

  <button class="login">♙ تسجيل الدخول</button>
</header>

<main class="container">

  <section class="hero">
    <h1>حوّل <span>خيالك</span> إلى واقع</h1>
    <p>
      أنشئ صوراً مذهلة من وصفك بالعربية أو الإنجليزية،
      واستكشف عالم الإبداع مع Khayal AI.
    </p>
  </section>

  <section class="modes">

    <div class="mode" id="animateCard" onclick="selectMode('animate')">
      <div class="mode-icon">✨</div>
      <div class="mode-title">التحريك</div>
    </div>

    <div class="mode" id="videoCard" onclick="selectMode('video')">
      <div class="mode-icon">🎬</div>
      <div class="mode-title">الفيديو</div>
    </div>

    <div class="mode active" id="imageCard" onclick="selectMode('image')">
      <div class="mode-icon">🏞️</div>
      <div class="mode-title">الصور</div>
    </div>

  </section>

  <section class="workspace">

    <h2 id="workspaceTitle">توليد الصور</h2>

    <div class="workspace-sub" id="workspaceSub">
      اكتب وصفاً بالعربية أو الإنجليزية وسنحوّله إلى صورة.
    </div>

    <div class="toggle">
      <button class="active" id="arBtn" onclick="setLanguage('ar')">
        العربية
      </button>

      <button id="enBtn" onclick="setLanguage('en')">
        English
      </button>
    </div>

    <div class="prompt-wrap">
      <textarea
        id="prompt"
        maxlength="1000"
        placeholder="اكتب فكرتك هنا... مثال: قطة بيضاء تجلس تحت المطر في مدينة مستقبلية ليلاً"
      ></textarea>

      <div class="counter" id="counter">0 / 1000</div>
    </div>

    <button class="generate" id="generateBtn" onclick="generate()">
      إنشاء الصورة
    </button>

    <div class="result" id="result"></div>

  </section>

</main>

<footer>
  © 2026 Khayal AI — الإبداع يبدأ من خيالك
</footer>

<div class="toast" id="toast"></div>

<script>
const API_URL =
  "https://khayal-ai-website.mohhhaa57.workers.dev/api/generate";

const promptBox = document.getElementById("prompt");
const counter = document.getElementById("counter");
const result = document.getElementById("result");
const generateBtn = document.getElementById("generateBtn");

let currentMode = "image";
let currentLanguage = "ar";

promptBox.addEventListener("input", () => {
  counter.textContent = promptBox.value.length + " / 1000";
});

function toast(message){
  const t = document.getElementById("toast");

  t.textContent = message;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    t.classList.remove("show");
  }, 2200);
}

function selectMode(mode){

  currentMode = mode;

  document.getElementById("imageCard")
    .classList.toggle("active", mode === "image");

  document.getElementById("videoCard")
    .classList.toggle("active", mode === "video");

  document.getElementById("animateCard")
    .classList.toggle("active", mode === "animate");

  const title = document.getElementById("workspaceTitle");
  const sub = document.getElementById("workspaceSub");

  if(mode === "image"){

    title.textContent = "توليد الصور";

    sub.textContent =
      "اكتب وصفاً بالعربية أو الإنجليزية وسنحوّله إلى صورة.";

    generateBtn.textContent = "إنشاء الصورة";

  }else if(mode === "video"){

    title.textContent = "توليد الفيديو";

    sub.textContent =
      "واجهة الفيديو جاهزة، وسيتم ربط محرك الفيديو في المرحلة القادمة.";

    generateBtn.textContent = "إنشاء الفيديو";

  }else{

    title.textContent = "تحريك الصور";

    sub.textContent =
      "سيتم إضافة رفع الصورة وتحريكها باستخدام محرك الفيديو.";

    generateBtn.textContent = "تحريك الصورة";
  }

  document.querySelector(".workspace")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

function setLanguage(lang){

  currentLanguage = lang;

  document.getElementById("arBtn")
    .classList.toggle("active", lang === "ar");

  document.getElementById("enBtn")
    .classList.toggle("active", lang === "en");

  if(lang === "ar"){

    promptBox.placeholder =
      "اكتب فكرتك هنا... مثال: قطة بيضاء تجلس تحت المطر في مدينة مستقبلية ليلاً";

  }else{

    promptBox.placeholder =
      "Describe your idea... Example: A white cat sitting under the rain in a futuristic city at night";
  }
}

async function generate(){

  if(currentMode !== "image"){

    toast(
      currentMode === "video"
      ? "توليد الفيديو سيتم تفعيله قريباً"
      : "تحريك الصور سيتم تفعيله قريباً"
    );

    return;
  }

  const prompt = promptBox.value.trim();

  if(!prompt){

    toast("اكتب وصفاً لفكرتك أولاً");

    promptBox.focus();

    return;
  }

  generateBtn.disabled = true;

  generateBtn.textContent = "جاري إنشاء الصورة...";

  result.classList.add("show");

  result.innerHTML = `
    <div class="loading">
      <span class="spinner"></span>
      <div style="margin-top:15px">
        جاري تحويل خيالك إلى صورة...
      </div>
    </div>
  `;

  try{

    const response = await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:prompt
      })

    });

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "حدث خطأ أثناء إنشاء الصورة"
      );
    }

    if(!data.image){

      throw new Error(
        "لم يتم استلام الصورة من الخادم"
      );
    }

    /*
      العلامة المائية تُدمج داخل الصورة
      نفسها قبل عرضها وتنزيلها.
    */

    const finalImage =
      await addWatermark(data.image);

    result.innerHTML = `

      <div class="result-image-wrap">

        <img
          id="generatedImage"
          src="${finalImage}"
          alt="الصورة التي تم إنشاؤها بواسطة Khayal AI"
        >

        <div class="watermark-preview">
          <span class="watermark-star">✦</span>
          <span>Khayal AI</span>
        </div>

      </div>

      <div class="result-actions">

        <a
          class="primary"
          href="${finalImage}"
          download="khayal-ai.png"
        >
          حفظ الصورة
        </a>

        <button
          class="secondary"
          onclick="downloadImage()"
        >
          تنزيل
        </button>

      </div>
    `;

    toast("تم إنشاء الصورة بنجاح ✨");

    result.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }catch(error){

    result.innerHTML = `
      <div class="loading">
        تعذر إنشاء الصورة
        <br>
        <small>${escapeHtml(error.message)}</small>
      </div>
    `;

    toast("تعذر إنشاء الصورة");

  }finally{

    generateBtn.disabled = false;

    generateBtn.textContent = "إنشاء الصورة";
  }
}


/*
  إضافة العلامة المائية إلى الصورة فعلياً
*/

function addWatermark(imageSrc){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = () => {

      try{

        const canvas =
          document.createElement("canvas");

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const scale =
          Math.max(canvas.width,canvas.height) / 1024;

        const padding = Math.round(24 * scale);

        const fontSize =
          Math.max(18,Math.round(22 * scale));

        const text =
          "✦  Khayal AI";

        ctx.font =
          "600 " + fontSize + "px Arial";

        const textWidth =
          ctx.measureText(text).width;

        const boxWidth =
          textWidth + padding * 1.6;

        const boxHeight =
          fontSize + padding;

        const x =
          canvas.width - boxWidth - padding;

        const y =
          canvas.height - boxHeight - padding;

        /*
          خلفية شفافة أنيقة
        */

        ctx.fillStyle =
          "rgba(5,7,20,0.58)";

        roundRect(
          ctx,
          x,
          y,
          boxWidth,
          boxHeight,
          Math.round(12 * scale)
        );

        ctx.fill();

        /*
          إطار خفيف
        */

        ctx.strokeStyle =
          "rgba(255,255,255,0.25)";

        ctx.lineWidth =
          Math.max(1,scale);

        ctx.stroke();

        /*
          النص
        */

        ctx.fillStyle =
          "rgba(255,255,255,0.78)";

        ctx.textAlign = "center";

        ctx.textBaseline = "middle";

        ctx.fillText(
          text,
          x + boxWidth / 2,
          y + boxHeight / 2
        );

        resolve(
          canvas.toDataURL(
            "image/png",
            1
          )
        );

      }catch(error){

        reject(error);

      }

    };

    img.onerror = () => {

      reject(
        new Error("تعذر تجهيز العلامة المائية")
      );

    };

    img.src = imageSrc;
  });
}


/*
  رسم مستطيل بزوايا ناعمة
*/

function roundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
){

  ctx.beginPath();

  ctx.moveTo(x + radius,y);

  ctx.lineTo(x + width - radius,y);

  ctx.quadraticCurveTo(
    x + width,
    y,
    x + width,
    y + radius
  );

  ctx.lineTo(
    x + width,
    y + height - radius
  );

  ctx.quadraticCurveTo(
    x + width,
    y + height,
    x + width - radius,
    y + height
  );

  ctx.lineTo(
    x + radius,
    y + height
  );

  ctx.quadraticCurveTo(
    x,
    y + height,
    x,
    y + height - radius
  );

  ctx.lineTo(
    x,
    y + radius
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x + radius,
    y
  );

  ctx.closePath();
}


function downloadImage(){

  const img =
    document.getElementById("generatedImage");

  if(!img){

    toast("لا توجد صورة لتنزيلها");

    return;
  }

  const link =
    document.createElement("a");

  link.href = img.src;

  link.download =
    "khayal-ai-watermarked.png";

  document.body.appendChild(link);

  link.click();

  link.remove();
}


function escapeHtml(text){

  return String(text).replace(
    /[&<>"']/g,
    function(match){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[match];

    }
  );
}
</script>

</body>
</html>
